<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      .text-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- High-End Text Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Bottom Vignette for Image Text Readability -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="50%" stop-color="rgba(34, 211, 238, 0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)" />
    </linearGradient>

    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <!-- Rounded Corner Mask for Profile Picture -->
    <clipPath id="avatar-clip">
      <rect x="42" y="42" width="396" height="526" rx="22" />
    </clipPath>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1180" height="610" fill="url(#dark-bg)" rx="16" />

  <!-- Ambient Glows -->
  <g filter="url(#blur-bg)" opacity="0.2">
    <circle cx="200" cy="150" r="180" fill="#7C3AED" />
    <circle cx="950" cy="450" r="220" fill="#22D3EE" />
  </g>

  <!-- ==================== LEFT SIDE: PROFILE IMAGE FRAME ==================== -->
  <g>
    <!-- Background backing behind photo -->
    <rect x="40" y="40" width="400" height="530" rx="24" fill="#0F172A" />
    
    <!-- Dynamically pulling your GitHub Image -->
    <image href="https://github.com/vineet-dwivedi.png" x="42" y="42" width="396" height="526" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" />
    
    <!-- Text Protective Fade Overlay Layer -->
    <rect x="42" y="300" width="396" height="268" fill="url(#vignette)" clip-path="url(#avatar-clip)" />

    <!-- Terminal System Info Layer (Over Picture) -->
    <g class="text-mono" font-size="13" fill="#94A3B8" transform="translate(70, 440)">
      <circle cx="-10" cy="-4" r="4" fill="#10B981" />
      <text x="5" y="0" fill="#10B981" font-weight="700" letter-spacing="1">SYS.ACTIVE</text>
      
      <text x="-10" y="28">OS: <tspan fill="#F8FAFC">Ubuntu LTS</tspan></text>
      <text x="-10" y="50">SHELL: <tspan fill="#F8FAFC">Zsh</tspan></text>
      <text x="-10" y="72">SDE_INTERN: <tspan fill="#22D3EE">Flowaris</tspan></text>
    </g>

    <!-- Outer Tech Glass Border Line -->
    <rect x="40" y="40" width="400" height="530" rx="24" fill="none" stroke="url(#border-shimmer)" stroke-width="2" />
  </g>

  <!-- ==================== RIGHT SIDE: TERMINAL ENGINE ==================== -->
  <g>
    <!-- Base Panel -->
    <rect x="475" y="40" width="665" height="530" rx="24" fill="#0F172A" fill-opacity="0.85" stroke="url(#border-shimmer)" stroke-width="2" />

    <!-- Top Window Menu Bar -->
    <rect x="475" y="40" width="665" height="42" rx="24" fill="#1E293B" fill-opacity="0.5" />
    <circle cx="500" cy="61" r="6" fill="#EF4444" />
    <circle cx="520" cy="61" r="6" fill="#F59E0B" />
    <circle cx="540" cy="61" r="6" fill="#10B981" />
    <text x="807" y="66" class="text-mono" font-size="13" fill="#64748B" text-anchor="middle">vineet@developer:~</text>

    <!-- Heading Container -->
    <text x="515" y="125" class="text-sans" font-size="24" font-weight="600" fill="#94A3B8">
      Hi 👋 I'm <tspan font-weight="800" fill="#F8FAFC">Vineet Dwivedi</tspan>
    </text>

    <!-- Curated Non-overlapping Subheader Line -->
    <text x="515" y="165" class="text-mono" font-size="18" font-weight="700" fill="url(#accent-grad)">
      Full-Stack Developer &amp; AI Specialist
    </text>

    <!-- Specs Grid Block -->
    <g class="text-mono" font-size="14" fill="#94A3B8" transform="translate(515, 220)">
      <text x="0" y="0" fill="#7C3AED" font-weight="700">📍 Location:</text>
      <text x="130" y="0" fill="#F8FAFC">India</text>
      
      <text x="0" y="32" fill="#22D3EE" font-weight="700">🎓 Education:</text>
      <text x="130" y="32" fill="#F8FAFC">Computer Science Engineering</text>
      
      <text x="0" y="64" fill="#10B981" font-weight="700">🚀 Focus:</text>
      <text x="130" y="64" fill="#F8FAFC">Scalable Systems &amp; AI Agents</text>
      
      <text x="0" y="96" fill="#F59E0B" font-weight="700">💼 Portfolio:</text>
      <text x="130" y="96" fill="#22D3EE" font-weight="700">sysc.vercel.app</text>
    </g>

    <!-- Tech Stack Engine Component -->
    <g transform="translate(515, 375)">
      <text x="0" y="0" class="text-sans" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1.5">TECH STACK ENGINE</text>
      
      <!-- Row 1 Tech Badges -->
      <g transform="translate(0, 15)" class="text-mono" font-size="12" fill="#F8FAFC">
        <rect x="0" y="0" width="65" height="26" rx="6" fill="#1E293B" />
        <text x="32.5" y="17" text-anchor="middle">React</text>
        
        <rect x="75" y="0" width="75" height="26" rx="6" fill="#1E293B" />
        <text x="112.5" y="17" text-anchor="middle">Next.js</text>
        
        <rect x="160" y="0" width="75" height="26" rx="6" fill="#1E293B" />
        <text x="197.5" y="17" text-anchor="middle">Node.js</text>
        
        <rect x="245" y="0" width="95" height="26" rx="6" fill="#1E293B" />
        <text x="292.5" y="17" text-anchor="middle">TypeScript</text>
      </g>

      <!-- Row 2 Tech Badges -->
      <g transform="translate(0, 50)" class="text-mono" font-size="12" fill="#F8FAFC">
        <rect x="0" y="0" width="75" height="26" rx="6" fill="#1E293B" />
        <text x="37.5" y="17" text-anchor="middle">Docker</text>
        
        <rect x="85" y="0" width="65" height="26" rx="6" fill="#1E293B" />
        <text x="117.5" y="17" text-anchor="middle">AWS</text>
        
        <rect x="160" y="0" width="85" height="26" rx="6" fill="#1E293B" />
        <text x="202.5" y="17" text-anchor="middle">Redis DB</text>
        
        <rect x="255" y="0" width="85" height="26" rx="6" fill="#1E293B" />
        <text x="297.5" y="17" text-anchor="middle">LiveKit</text>
      </g>
    </g>

    <!-- Lower Execution Terminal Bar -->
    <g transform="translate(515, 485)">
      <line x1="0" y1="0" x2="585" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="5" cy="22" r="4" fill="#10B981" />
      <text x="18" y="26" class="text-mono" font-size="11" fill="#64748B">PRODUCTION READY SYSTEM</text>
    </g>
  </g>
</svg>
