<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" width="100%" height="100%">
  <defs>
    <style>
      .text-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
      
      /* --- SYSTEM SAFE OPACITY REVEAL --- */
      @keyframes FadeReveal {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .layer-bg { animation: FadeReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .layer-1 { opacity: 0; animation: FadeReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
      .layer-2 { opacity: 0; animation: FadeReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
      .layer-3 { opacity: 0; animation: FadeReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
      .layer-4 { opacity: 0; animation: FadeReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; }
      .layer-footer { opacity: 0; animation: FadeReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards; }

      .tech-pill { fill: #F4F4F5; stroke: #E4E4E7; stroke-width: 1; }
    </style>

    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
  </defs>

  <rect width="1180" height="480" fill="url(#studio-bg)" rx="12" class="layer-bg" />

  <g fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1">
    <rect x="50" y="40" width="1080" height="400" rx="16" />
  </g>

  <g class="layer-1">
    <circle cx="80" cy="65" r="5" fill="#E4E4E7" />
    <circle cx="96" cy="65" r="5" fill="#E4E4E7" />
    <circle cx="112" cy="65" r="5" fill="#E4E4E7" />
    <text x="135" y="70" class="text-mono" font-size="12" fill="#A1A1AA">vineet@architecture:~</text>
    
    <text x="90" y="135" class="text-sans" font-size="28" font-weight="400" fill="#71717A">
      Hi, I'm <tspan font-weight="600" fill="#09090B">Vineet Dwivedi</tspan>
    </text>
  </g>

  <g class="layer-2">
    <text x="90" y="175" class="text-mono" font-size="16" font-weight="500" fill="#27272A" letter-spacing="0.5">
      Full Stack Developer &amp; AI Integration Specialist
    </text>
    <line x1="90" y1="205" x2="1090" y2="205" stroke="#E4E4E7" stroke-width="1" />
  </g>

  <g class="layer-3 text-mono" font-size="14" fill="#A1A1AA" transform="translate(90, 245)">
    <text x="0" y="0" font-weight="600" fill="#71717A">📍 Focus</text>
    <text x="140" y="0" fill="#09090B">Scalable Web Engines &amp; Intelligent Agents</text>
    
    <text x="0" y="36" font-weight="600" fill="#71717A">🎓 Education</text>
    <text x="140" y="36" fill="#09090B">Computer Science Engineering</text>
    
    <text x="0" y="72" font-weight="600" fill="#71717A">💻 Env</text>
    <text x="140" y="72" fill="#27272A">Ubuntu LTS // Zsh</text>
    
    <text x="0" y="108" font-weight="600" fill="#71717A">💼 Experience</text>
    <text x="140" y="108" fill="#27272A">Former SDE Intern @ Flowaris Technologies</text>
  </g>

  <g class="layer-4" transform="translate(680, 245)">
    <text x="0" y="0" class="text-sans" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="1.5">STACK COMPILER</text>
    
    <g transform="translate(0, 15)" class="text-mono" font-size="12" fill="#27272A">
      <rect x="0" y="0" width="70" height="28" rx="4" class="tech-pill" />
      <text x="35" y="18" text-anchor="middle">React</text>
      
      <rect x="80" y="0" width="75" height="28" rx="4" class="tech-pill" />
      <text x="117.5" y="18" text-anchor="middle">Next.js</text>
      
      <rect x="165" y="0" width="75" height="28" rx="4" class="tech-pill" />
      <text x="202.5" y="18" text-anchor="middle">Node.js</text>
      
      <rect x="250" y="0" width="95" height="28" rx="4" class="tech-pill" />
      <text x="297.5" y="18" text-anchor="middle">TypeScript</text>
    </g>

    <g transform="translate(0, 52)" class="text-mono" font-size="12" fill="#27272A">
      <rect x="0" y="0" width="75" height="28" rx="4" class="tech-pill" />
      <text x="37.5" y="18" text-anchor="middle">Docker</text>
      
      <rect x="85" y="0" width="65" height="28" rx="4" class="tech-pill" />
      <text x="117.5" y="18" text-anchor="middle">AWS</text>
      
      <rect x="160" y="0" width="85" height="28" rx="4" class="tech-pill" />
      <text x="202.5" y="18" text-anchor="middle">Redis DB</text>
      
      <rect x="255" y="0" width="85" height="28" rx="4" class="tech-pill" />
      <text x="297.5" y="18" text-anchor="middle">LiveKit</text>
    </g>
  </g>

  <g class="layer-footer" transform="translate(90, 390)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#E4E4E7" stroke-width="1" />
    <circle cx="5" cy="22" r="3.5" fill="#71717A" />
    <text x="18" y="26" class="text-mono" font-size="11" fill="#A1A1AA">STATUS: STABLE SYSTEM // DEPLOYED AT sysc.vercel.app</text>
  </g>
</svg>
