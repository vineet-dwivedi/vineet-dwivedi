<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      .text-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Light Theme Gradient Text -->
    <linearGradient id="accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Bottom Overlay for Light Mode -->
    <linearGradient id="vignette-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="60%" stop-color="#F8FAFC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="border-shimmer-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.06)" />
      <stop offset="50%" stop-color="rgba(37, 99, 235, 0.2)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0.06)" />
    </linearGradient>

    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <clipPath id="avatar-clip">
      <rect x="42" y="42" width="396" height="526" rx="22" />
    </clipPath>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1180" height="610" fill="url(#light-bg)" rx="16" />

  <!-- Ambient Light Glows -->
  <g filter="url(#blur-bg)" opacity="0.08">
    <circle cx="200" cy="150" r="200" fill="#2563EB" />
    <circle cx="950" cy="450" r="250" fill="#10B981" />
  </g>

  <!-- ==================== LEFT SIDE: PROFILE IMAGE FRAME ==================== -->
  <g>
    <rect x="40" y="40" width="400" height="530" rx="24" fill="#F8FAFC" />
    
    <!-- Dynamically pulling your GitHub Image -->
    <image href="https://github.com/vineet-dwivedi.png" x="42" y="42" width="396" height="526" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" />
    
    <rect x="42" y="300" width="396" height="268" fill="url(#vignette-light)" clip-path="url(#avatar-clip)" />

    <!-- Terminal Status Info Over Picture -->
    <g class="text-mono" font-size="13" fill="#475569" transform="translate(70, 440)">
      <circle cx="-10" cy="-4" r="4" fill="#10B981" />
      <text x="5" y="0" fill="#10B981" font-weight="700" letter-spacing="1">SYS.ACTIVE</text>
      
      <text x="-10" y="28">OS: <tspan fill="#0F172A">Ubuntu LTS</tspan></text>
      <text x="-10" y="50">SHELL: <tspan fill="#0F172A">Zsh</tspan></text>
      <text x="-10" y="72">SDE_INTERN: <tspan fill="#2563EB">Flowaris</tspan></text>
    </g>

    <rect x="40" y="40" width="400" height="530" rx="24" fill="none" stroke="url(#border-shimmer-light)" stroke-width="2" />
  </g>

  <!-- ==================== RIGHT SIDE: TERMINAL ENGINE ==================== -->
  <g>
    <rect x="475" y="40" width="665" height="530" rx="24" fill="#F8FAFC" fill-opacity="0.9" stroke="url(#border-shimmer-light)" stroke-width="2" />

    <!-- Window Chrome Mac Bar -->
    <rect x="475" y="40" width="665" height="42" rx="24" fill="#E2E8F0" fill-opacity="0.7" />
    <circle cx="500" cy="61" r="6" fill="#EF4444" />
    <circle cx="520" cy="61" r="6" fill="#F59E0B" />
    <circle cx="540" cy="61" r="6" fill="#10B981" />
    <text x="807" y="66" class="text-mono" font-size="13" fill="#475569" text-anchor="middle">vineet@developer:~</text>

    <!-- Safe Combined Typography Headers -->
    <text x="515" y="125" class="text-sans" font-size="24" font-weight="600" fill="#475569">
      Hi 👋 I'm <tspan font-weight="800" fill="#0F172A">Vineet Dwivedi</tspan>
    </text>

    <text x="515" y="165" class="text-mono" font-size="18" font-weight="700" fill="url(#accent-grad-light)">
      Full-Stack Developer &amp; AI Specialist
    </text>

    <!-- Meta Fields Grid -->
    <g class="text-mono" font-size="14" fill="#475569" transform="translate(515, 220)">
      <text x="0" y="0" fill="#2563EB" font-weight="700">📍 Location:</text>
      <text x="130" y="0" fill="#0F172A">India</text>
      
      <text x="0" y="32" fill="#06B6D4" font-weight="700">🎓 Education:</text>
      <text x="130" y="32" fill="#0F172A">Computer Science Engineering</text>
      
      <text x="0" y="64" fill="#10B981" font-weight="700">🚀 Focus:</text>
      <text x="130" y="64" fill="#0F172A">Scalable Systems &amp; AI Agents</text>
      
      <text x="0" y="96" fill="#F59E0B" font-weight="700">💼 Portfolio:</text>
      <text x="130" y="96" fill="#2563EB" font-weight="700">sysc.vercel.app</text>
    </g>

    <!-- Tech Stack Pill Engines -->
    <g transform="translate(515, 375)">
      <text x="0" y="0" class="text-sans" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="1.5">TECH STACK ENGINE</text>
      
      <g transform="translate(0, 15)" class="text-mono" font-size="12" fill="#0F172A">
        <rect x="0" y="0" width="65" height="26" rx="6" fill="#EDF2F7" />
        <text x="32.5" y="17" text-anchor="middle">React</text>
        
        <rect x="75" y="0" width="75" height="26" rx="6" fill="#EDF2F7" />
        <text x="112.5" y="17" text-anchor="middle">Next.js</text>
        
        <rect x="160" y="0" width="75" height="26" rx="6" fill="#EDF2F7" />
        <text x="197.5" y="17" text-anchor="middle">Node.js</text>
        
        <rect x="245" y="0" width="95" height="26" rx="6" fill="#EDF2F7" />
        <text x="292.5" y="17" text-anchor="middle">TypeScript</text>
      </g>

      <g transform="translate(0, 50)" class="text-mono" font-size="12" fill="#0F172A">
        <rect x="0" y="0" width="75" height="26" rx="6" fill="#EDF2F7" />
        <text x="37.5" y="17" text-anchor="middle">Docker</text>
        
        <rect x="85" y="0" width="65" height="26" rx="6" fill="#EDF2F7" />
        <text x="117.5" y="17" text-anchor="middle">AWS</text>
        
        <rect x="160" y="0" width="85" height="26" rx="6" fill="#EDF2F7" />
        <text x="202.5" y="17" text-anchor="middle">Redis DB</text>
        
        <rect x="255" y="0" width="85" height="26" rx="6" fill="#EDF2F7" />
        <text x="297.5" y="17" text-anchor="middle">LiveKit</text>
      </g>
    </g>

    <!-- Bottom Execution Terminal Bar -->
    <g transform="translate(515, 485)">
      <line x1="0" y1="0" x2="585" y2="0" stroke="rgba(15,23,42,0.06)" stroke-width="1" />
      <circle cx="5" cy="22" r="4" fill="#10B981" />
      <text x="18" y="26" class="text-mono" font-size="11" fill="#94A3B8">PRODUCTION READY SYSTEM</text>
    </g>
  </g>
</svg>
